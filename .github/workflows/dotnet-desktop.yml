name: Build + Sign (NET40)

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2019

    strategy:
      matrix:
        configuration: [Release]

    env:
      Solution_Name: SignTool.sln
      Test_Project_Path: SignTool\SignTool.csproj
      Platform: Any CPU

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 对于 .NET Framework 4.0：用 VS/MSBuild 编译最稳
      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      # 可选：如果你解决方案里有 NuGet packages.config，需要先 restore
      #（如果你没用 packages.config，这步不会有害处）
      - name: NuGet restore
        shell: pwsh
        run: |
          nuget help > $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "NuGet not found; installing..."
            choco install nuget.commandline -y
          }
          nuget restore "$env:Solution_Name"

      - name: Build (Release, Any CPU)
        shell: pwsh
        run: |
          msbuild "$env:Solution_Name" `
            /m `
            /t:Build `
            /p:Configuration="${{ matrix.configuration }}" `
            /p:Platform="$env:Platform"

      - name: Locate built exe
        id: locate
        shell: pwsh
        run: |
          $config = "${{ matrix.configuration }}"
          $exe = Get-ChildItem -Recurse -File -Filter "SignTool.exe" "$env:GITHUB_WORKSPACE" |
            Where-Object { $_.FullName -match "\\bin\\$config\\" } |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host "Could not find SignTool.exe under bin\$config. Dumping candidates:"
            Get-ChildItem -Recurse -File -Filter "*.exe" "$env:GITHUB_WORKSPACE" |
              Where-Object { $_.FullName -match "\\bin\\$config\\" } |
              ForEach-Object { Write-Host $_.FullName }
            throw "SignTool.exe not found"
          }

          "exePath=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "exeDir=$($exe.DirectoryName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Found exe: $($exe.FullName)"

      # 如果是 tag 推送（refs/tags/v1.2.3），重命名为 SignTool_v1.2.3.exe
      - name: Rename exe on tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"   # e.g. v1.2.3
          $src = "${{ steps.locate.outputs.exePath }}"
          $dst = Join-Path (Split-Path $src -Parent) ("SignTool_{0}.exe" -f $tag)
          Copy-Item -LiteralPath $src -Destination $dst -Force
          Write-Host "Renamed copy: $dst"
          "finalExePath=$dst" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set final exe path (non-tag)
        if: "!startsWith(github.ref, 'refs/tags/')"
        shell: pwsh
        run: |
          "finalExePath=${{ steps.locate.outputs.exePath }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Decode PFX from Secrets
        shell: pwsh
        run: |
          $pfxB64 = "${{ secrets.SIGNING_PFX_BASE64 }}"
          if ([string]::IsNullOrWhiteSpace($pfxB64)) { throw "SIGNING_PFX_BASE64 is empty" }
          $bytes = [Convert]::FromBase64String($pfxB64)
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          "pfxPath=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign EXE
        shell: pwsh
        run: |
          $exe = "$env:finalExePath"
          if (-not (Test-Path -LiteralPath $exe)) { throw "final exe not found: $exe" }

          signtool sign `
            /f "$env:pfxPath" `
            /p "${{ secrets.SIGNING_PFX_PASSWORD }}" `
            /fd sha256 `
            /tr "http://timestamp.digicert.com" `
            /td sha256 `
            "$exe"

          signtool verify /pa "$exe"

      - name: Upload signed output folder
        uses: actions/upload-artifact@v4
        with:
          name: signed-build
          path: |
            ${{ steps.locate.outputs.exeDir }}\**\*
